[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oda-knowledge-base"
version = "0.8.0"
description = "oda-sparql"
license = " GPL-2.0-or-later"
authors = [
    { name = "V.S.", email = "vladimir.savchenko@gmail.com" }
]
maintainers = [
    { name = "V.S.", email = "vladimir.savchenko@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "lxml",
    "six",
    "coloredlogs",
    "path",
    "minio<7.0.0",
    "keyring",
    "keyrings.cryptfile",
    "click",
    "pyyaml",
    "numpy",
    "click_aliases",
    "dynaconf",
    "html2text",
    "pluggy",
]

[project.optional-dependencies]
notebook = [
    "nb2workflow",
    "papermill",
]
rdf = [
    "rdflib",
    "rdflib-jsonld",
]
cwl = [
    "cwltool",
]

[dependency-groups]
dev = [
  "pytest"
]

[project.urls]
Homepage = "https://odahub.io/"

[project.scripts]
oda-kb = "odakb.sparql:cli"
oda-kb-eval = "odakb.evaluator:main"
oda-kb-datalake = "odakb.datalake:cli"
oda = "odakb.cli:oda"

[tool.setuptools]
include-package-data = true
packages = {find={}}

